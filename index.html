<!DOCTYPE html>
<html>

<head>
    <title>AI Smart Waste Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🌱 AI Smart Waste Management Assistant</h1>
        <p>Smart guidance for responsible waste management</p>
    </header>

    <main>

        <section class="card">

            <h2>♻️ Waste Assistant</h2>

            <p>
                Enter the name or description of a waste item:
            </p>

            <input
                type="text"
                id="wasteInput"
                placeholder="Example: plastic bottle"
            >
            <div class="input-tools">

    <button class="voice-btn" onclick="startVoiceInput()">
        🎤 Speak
    </button>

    <button class="camera-btn" onclick="openCamera()">
        📷 Scan Waste
    </button>

</div>
<div id="cameraArea" class="camera-area" style="display: none;">

    <video id="camera" autoplay playsinline></video>

    <div>
        <button onclick="captureWasteImage()">
            📸 Capture
        </button>

        <button class="clear-btn" onclick="closeCamera()">
            ✖ Close Camera
        </button>
    </div>

    <canvas id="cameraCanvas"></canvas>

</div>

            <div class="examples">

                <p><b>Try an example:</b></p>

                <button class="example-btn" onclick="useExample('plastic bottle')">
                    🧴 Plastic Bottle
                </button>

                <button class="example-btn" onclick="useExample('newspaper')">
                    📄 Newspaper
                </button>

                <button class="example-btn" onclick="useExample('food waste')">
                    🍎 Food Waste
                </button>

                <button class="example-btn" onclick="useExample('old mobile phone')">
                    📱 Old Phone
                </button>

            </div>

            <button onclick="analyzeWaste()">
                🔍 Analyze Waste
            </button>

            <button class="clear-btn" onclick="clearResult()">
                🧹 Clear
            </button>

            <div id="result">
                <p>Enter a waste item to get guidance.</p>
            </div>

        </section>

    </main>

    <footer>
        <p>AI for Sustainability | SDG 12</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
